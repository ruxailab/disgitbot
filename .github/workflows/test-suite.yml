name: Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-asyncio pytest-mock
        if [ -f pr_review/requirements.txt ]; then pip install -r pr_review/requirements.txt; fi
        if [ -f discord_bot/requirements.txt ]; then pip install -r discord_bot/requirements.txt; fi

    - name: Run unit tests
      run: |
        pytest -m "unit" --cov --cov-report=xml --cov-report=term
      continue-on-error: true

    - name: Run integration tests
      run: |
        pytest -m "integration" --cov --cov-append --cov-report=xml --cov-report=term
      continue-on-error: true

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.13'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage report
      if: always()
      run: |
        if [ -f coverage.xml ]; then
          echo "Coverage report generated successfully"
          pytest --cov --cov-report=term-missing || true
        else
          echo "No coverage data available"
        fi

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 isort mypy bandit

    - name: Check code formatting with Black
      run: black --check --line-length=100 .
      continue-on-error: true

    - name: Check import sorting with isort
      run: isort --check-only --profile black --line-length 100 .
      continue-on-error: true

    - name: Lint with flake8
      run: flake8 . --max-line-length=100 --extend-ignore=E203,W503 --count --statistics
      continue-on-error: true

    - name: Security check with bandit
      run: bandit -r . -f json -o bandit-report.json || true
      continue-on-error: true

    - name: Upload bandit report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bandit-security-report
        path: bandit-report.json
