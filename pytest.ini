[pytest]
# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests pr_review/tests discord_bot/tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=pr_review
    --cov=discord_bot
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=60
    --maxfail=5
    --durations=10

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    discord: Discord bot related tests
    github: GitHub integration tests
    ai: AI/ML related tests
    requires_api: Tests requiring external API access

# Coverage options
[coverage:run]
source = pr_review,discord_bot
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */venv/*
    */env/*
    */config/*
    */deployment/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
